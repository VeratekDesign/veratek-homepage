<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us – Veratek Design</title>
  <meta name="description" content="Contact Veratek Design, 2434 Auto Park Way, #201, Escondido, CA 92029.">
  <link rel="canonical" href="https://veratekdesign.com/contact-us">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header container">
    <a href="/"><img class="logo" src="images/logo.png" alt="Veratek Design Inc"></a>
    <p class="tagline">Electronic Hardware and Embedded Software Design</p>
    <hr>
    <nav class="main-nav">
      <a href="/">Home</a>
      <a href="/about-us">About Us</a>
      <a href="/contact-us" aria-current="page">Contact Us</a>
    </nav>
  </header>

  <main class="container page">
    <div class="two-col contact">
      <section>
        <h2>Contact Us</h2>
        <div class="map">
          <iframe src="https://maps.google.com/maps?q=2434+Auto+Park+Way,+%23201,+Escondido,+CA+92029&amp;z=14&amp;output=embed" title="Map of Veratek Design" loading="lazy"></iframe>
          <a class="map-link" href="https://maps.google.com/maps?q=2434+Auto+Park+Way,+%23201,+Escondido,+CA+92029&amp;z=14" target="_blank" rel="noopener">View Larger Map</a>
        </div>
        <div class="address">
          <p>Veratek Design<br>2434 Auto Park Way, #201<br>Escondido, CA 92029</p>
          <p>Phone: <a href="tel:+17605800663">(760) 580-0663</a><br>E-mail: <a href="mailto:info@veratekdesign.com">info@veratekdesign.com</a></p>
        </div>
      </section>

      <!-- Sent to /api/contact (src/worker.js), which checks Turnstile and emails info@. -->
      <form class="contact-form" id="contact-form" action="/api/contact" method="post">
        <label for="name">Name: <span>*</span></label>
        <input id="name" name="name" required>
        <label for="email">Email: <span>*</span></label>
        <input id="email" name="email" type="email" required>
        <label for="subject">Subject: <span>*</span></label>
        <input id="subject" name="subject" required>
        <label for="message">Message: <span>*</span></label>
        <textarea id="message" name="message" required></textarea>
        <!-- Honeypot: hidden from people, bots fill it in. -->
        <input class="hp" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
        <!-- Turnstile site key. 1x00000000000000000000AA is Cloudflare's always-pass test key; replace with the real one. -->
        <div class="cf-turnstile" data-sitekey="1x00000000000000000000AA" data-appearance="interaction-only"></div>
        <button type="submit">Submit</button>
        <p class="form-status" id="form-status" role="status"></p>
      </form>
    </div>
  </main>

  <footer class="site-footer container">
    <hr>
    <div class="footer-row">
      <div>
        <div class="footer-name">Veratek Design</div>
        <nav class="footer-nav">
          <a href="/">Home</a>
          <a href="/about-us">About Us</a>
          <a href="/contact-us">Contact Us</a>
        </nav>
      </div>
      <div class="footer-right">
        <div class="copyright">&copy; Copyright 2020</div>
        <a class="social" href="https://www.facebook.com/Veratek-Design-Inc-257755900920896/" aria-label="Veratek Design on Facebook">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg>
        </a>
      </div>
    </div>
  </footer>

  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    document.getElementById("contact-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      var form = this;
      var status = document.getElementById("form-status");
      var button = form.querySelector("button");
      button.disabled = true;
      status.className = "form-status";
      status.textContent = "Sending…";
      var data = await fetch(form.action, { method: "POST", body: new FormData(form) })
        .then(function (res) { return res.json(); })
        .catch(function () { return {}; });
      if (data.ok) {
        form.reset();
        status.textContent = "Thank you for contacting us! If needed, you will hear back within 48-72 hours.";
      } else {
        status.className = "form-status error";
        status.textContent = data.error || "Sorry, your message could not be sent. Please email us directly.";
        button.disabled = false;
      }
      if (window.turnstile) turnstile.reset();
    });
  </script>
</body>
</html>
